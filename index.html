<!doctype html>
<html lang="en">
<head>
<!--ssr-head-->
<script>
(function () {
  // The opt-in is inserted here, synchronously while the head is parsed, so that it is in force before the first
  // render of every page (D-061). The ::view-transition-* rules live in src/style.css.
  var optIn = document.createElement('style');
  optIn.textContent = '@view-transition { navigation: auto; } @media (prefers-reduced-motion: reduce) { @view-transition { navigation: none; } }';
  document.head.appendChild(optIn);

  // The three pairs of the card-to-band morph (T-037), in this order: the box, the title, the summary.
  var NAMES = ['case-card', 'case-title', 'case-summary'];
  // Every element that can carry one of the three names, on either page.
  var NAMEABLE = '.panel-card, .panel-card > h3, .panel-card > .card-summary, .band, .band > h1, .band > .lead';
  // Home to these two pages morphs the card that leads there into the page's header band (D-041).
  // Every other navigation keeps the browser's 0.25 s crossfade and carries no name.
  var TARGET = /^\/(?:projects\/certway|report)\/$/;
  // The morph runs only when the navigation follows a click on a card (G-68): the footer also links to /report/, and
  // Forward and a script-set location.href also reach a target, and D-041 gives all of them the crossfade. The last
  // click is remembered here (true only for an unmodified primary click on a card link that leads to a target, so a
  // ctrl-click that opens a tab leaves it false), and pageswap hands a crossfade decision to the new page through this key.
  var CROSSFADE_KEY = 'vt-crossfade';
  var cardClicked = false;
  addEventListener('click', function (e) {
    var a = e.target && e.target.closest ? e.target.closest('a[href]') : null;
    var plain = e.button === 0 && !e.ctrlKey && !e.metaKey && !e.shiftKey && !e.altKey;
    cardClicked = plain && !!a && !!a.closest('.panel-card') && TARGET.test(pathOf(a.href));
  }, true);

  // Gate for same-document transitions: window.vtSettled() resolves when no
  // cross-document transition is pending.
  var settled = false, openGate, gate;
  function arm() { settled = false; gate = new Promise(function (r) { openGate = r; }); }
  function open() { settled = true; openGate(); }
  arm();
  if (!('onpagereveal' in window)) open();
  window.vtSettled = function () { return gate; };

  function paused() {
    try { return sessionStorage.getItem('motion-paused') === '1'; } catch (e) { return false; }
  }
  function pathOf(url) {
    try {
      var p = new URL(url, location.href).pathname.replace(/index\.html$/, '');
      return p.charAt(p.length - 1) === '/' ? p : p + '/';
    } catch (e) { return ''; }
  }
  function isPair(from, to) { return from === '/' && TARGET.test(to); }
  function takeCrossfade() {
    try {
      var v = sessionStorage.getItem(CROSSFADE_KEY) === '1';
      sessionStorage.removeItem(CROSSFADE_KEY);
      return v;
    } catch (e) { return false; }
  }
  function activationFrom() {
    var a = window.navigation && navigation.activation;
    if (a && a.from) return pathOf(a.from.url);
    return document.referrer ? pathOf(document.referrer) : '';
  }
  function clearNames() {
    var els = document.querySelectorAll(NAMEABLE);
    for (var i = 0; i < els.length; i++) els[i].style.viewTransitionName = '';
  }
  function cardFor(path) {
    var cards = document.querySelectorAll('.panel-card');
    for (var i = 0; i < cards.length; i++) {
      var links = cards[i].querySelectorAll('a[href]');
      for (var j = 0; j < links.length; j++) if (pathOf(links[j].href) === path) return cards[i];
    }
    return null;
  }
  // One side of the morph, in NAMES order. A part that is missing stays null and gets no name.
  function cardParts(card) {
    return card ? [card, card.querySelector(':scope > h3'), card.querySelector(':scope > .card-summary')] : [];
  }
  function bandParts() {
    var band = document.querySelector('.band');
    return band ? [band, band.querySelector(':scope > h1'), band.querySelector(':scope > .lead')] : [];
  }
  // The number of lines the band's h1 wraps to; src/style.css scales the old title image by it.
  function setTitleLines(h1) {
    if (!h1) return;
    var lh = parseFloat(getComputedStyle(h1).lineHeight);
    if (lh > 0) document.documentElement.style.setProperty('--vt-title-lines', String(Math.max(1, Math.round(h1.getBoundingClientRect().height / lh))));
  }
  function name(parts, vt, after) {
    for (var i = 0; i < parts.length; i++) if (parts[i]) parts[i].style.viewTransitionName = NAMES[i];
    function done() {
      for (var i = 0; i < parts.length; i++) if (parts[i]) parts[i].style.viewTransitionName = '';
      document.documentElement.style.removeProperty('--vt-title-lines');
      if (after) after();
    }
    vt.finished.then(done, done);
  }

  addEventListener('pageswap', function (e) {
    var vt = e.viewTransition;
    if (!vt) return;
    vt.ready.catch(function () {});
    if (paused()) { vt.skipTransition(); return; }
    var from = pathOf(location.href);
    var to = e.activation && e.activation.entry ? pathOf(e.activation.entry.url) : '';
    clearNames();
    if (!isPair(from, to)) return;
    if (!cardClicked) {
      try { sessionStorage.setItem(CROSSFADE_KEY, '1'); } catch (e) {}
      return;
    }
    name(cardParts(cardFor(to)), vt);
  });

  addEventListener('pagereveal', function (e) {
    if (settled) arm();
    var crossfade = takeCrossfade();
    var vt = e.viewTransition;
    if (!vt) { open(); return; }
    vt.ready.catch(function () {});
    if (paused()) {
      vt.finished.then(open, open);
      vt.skipTransition();
      return;
    }
    clearNames();
    if (!crossfade && isPair(activationFrom(), pathOf(location.href))) {
      var parts = bandParts();
      setTitleLines(parts[1]);
      name(parts, vt, open);
    } else vt.finished.then(open, open);
  });
  // A restore from the back-forward cache fires pageshow before pagereveal.
  addEventListener('pageshow', function (e) {
    if (e.persisted) cardClicked = false;
    if (e.persisted && settled && 'onpagereveal' in window) arm();
  });
})();
</script>
</head>
<body>
<div id="root"><!--ssr-app--></div>
<!--ssr-data-->
<script type="module" src="/src/entry-client.tsx"></script>
</body>
</html>
